bundle:
  name: trade-reconciliation

include:
  - resources/pipelines/*.yaml
  - resources/jobs/*.yaml

variables:
  catalog_name:
    description: Unity Catalog catalog for this environment

  landing_schema:
    description: Landing schema
    default: landing

  bronze_schema:
    description: Bronze schema
    default: bronze

  silver_schema:
    description: Silver schema
    default: silver

  source_volume:
    description: Synthetic source file volume
    default: synthetic_trade_files
  
  reconciliation_schema:
    description: Reconciliation schema
    default: reconciliation

  gold_schema:
    description: Gold reporting schema
    default: gold

  price_tolerance:
    description: Absolute price tolerance used by reconciliation
    default: "0.01"

  missing_side_sla_minutes:
    description: Minutes allowed before a missing counterparty becomes a break
    default: "30"

targets:
  dev:
    default: true
    mode: development

    presets:
      name_prefix: ""
    
    variables:
      catalog_name: workspace

    workspace:
      host: https://dbc-8a88764b-6068.cloud.databricks.com