resources:
  pipelines:
    broker_bronze:
      name: tr022_broker_bronze
      catalog: ${var.catalog_name}
      schema: ${var.bronze_schema}
      photon: true
      serverless: true
      continuous: false

      configuration:
        trade_recon.broker_source_path: /Volumes/${var.catalog_name}/${var.landing_schema}/${var.source_volume}/*/broker_a

      libraries:
        - file:
            path: ../../src/trade_recon/pipelines/broker_bronze.py